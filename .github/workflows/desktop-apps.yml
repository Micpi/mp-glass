name: MP Nexus desktop applications
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build for
        required: true
        type: string
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run build:demo
      - name: Publish self-contained Windows application
        run: dotnet publish desktop/MpNexus.Launcher.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:OutputType=WinExe -o desktop/publish/win-x64
      - name: Attach Windows application to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Copy-Item desktop/publish/win-x64/MpNexus.Launcher.exe MP-Nexus-Windows-x64.exe
          gh release upload "${{ github.event.release.tag_name || inputs.tag }}" MP-Nexus-Windows-x64.exe --clobber

  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            rid: osx-arm64
            arch: Apple-Silicon
          - runner: macos-15-intel
            rid: osx-x64
            arch: Intel
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || inputs.tag }}
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: npm ci
      - run: npm run build:demo
      - name: Publish self-contained macOS application
        env:
          RID: ${{ matrix.rid }}
          ARCH: ${{ matrix.arch }}
        run: |
          APP="MP Nexus.app"
          TAG="${{ github.event.release.tag_name || inputs.tag }}"
          VERSION="${TAG#v}"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          dotnet publish desktop/MpNexus.Launcher.csproj -c Release -r "$RID" --self-contained true -p:PublishSingleFile=true -o "$APP/Contents/MacOS"
          ICONSET="$APP/Contents/Resources/MPNexus.iconset"
          mkdir -p "$ICONSET"
          sips -z 16 16 custom_components/mp_glass/brand/icon.png --out "$ICONSET/icon_16x16.png" >/dev/null
          sips -z 32 32 custom_components/mp_glass/brand/icon.png --out "$ICONSET/icon_16x16@2x.png" >/dev/null
          sips -z 32 32 custom_components/mp_glass/brand/icon.png --out "$ICONSET/icon_32x32.png" >/dev/null
          sips -z 64 64 custom_components/mp_glass/brand/icon.png --out "$ICONSET/icon_32x32@2x.png" >/dev/null
          sips -z 128 128 custom_components/mp_glass/brand/icon.png --out "$ICONSET/icon_128x128.png" >/dev/null
          sips -z 256 256 custom_components/mp_glass/brand/icon.png --out "$ICONSET/icon_128x128@2x.png" >/dev/null
          sips -z 256 256 custom_components/mp_glass/brand/icon.png --out "$ICONSET/icon_256x256.png" >/dev/null
          sips -z 512 512 custom_components/mp_glass/brand/icon.png --out "$ICONSET/icon_256x256@2x.png" >/dev/null
          sips -z 512 512 custom_components/mp_glass/brand/icon.png --out "$ICONSET/icon_512x512.png" >/dev/null
          sips -z 1024 1024 custom_components/mp_glass/brand/icon.png --out "$ICONSET/icon_512x512@2x.png" >/dev/null
          iconutil -c icns "$ICONSET" -o "$APP/Contents/Resources/MPNexus.icns"
          rm -rf "$ICONSET"
          cat > "$APP/Contents/Info.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>MpNexus.Launcher</string>
            <key>CFBundleIdentifier</key><string>com.mpglass.nexus.demo</string>
            <key>CFBundleName</key><string>MP Nexus</string>
            <key>CFBundleDisplayName</key><string>MP Nexus</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleIconFile</key><string>MPNexus.icns</string>
            <key>CFBundleVersion</key><string>$VERSION</string>
            <key>CFBundleShortVersionString</key><string>$VERSION</string>
            <key>LSMinimumSystemVersion</key><string>12.0</string>
            <key>NSLocalNetworkUsageDescription</key><string>MP Nexus partage la démonstration avec vos appareils sur le même réseau Wi-Fi.</string>
          </dict></plist>
          PLIST
          codesign --force --deep --sign - "$APP"
          ditto -c -k --keepParent "$APP" "MP-Nexus-macOS-${ARCH}.zip"
      - name: Attach macOS application to release
        env:
          GH_TOKEN: ${{ github.token }}
          ARCH: ${{ matrix.arch }}
        run: gh release upload "${{ github.event.release.tag_name || inputs.tag }}" "MP-Nexus-macOS-${ARCH}.zip" --clobber
