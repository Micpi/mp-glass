name: mp-nexus-demo

services:
  mp-nexus:
    image: ghcr.io/micpi/mp-glass-demo:latest
    restart: unless-stopped
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/__mpnexus/login || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    environment:
      MP_NEXUS_CONTAINER: "1"
      MP_NEXUS_PORT: "8080"
      MP_NEXUS_LAUNCHER_NO_BROWSER: "1"
      MP_NEXUS_ADMIN_USERNAME: ${MP_NEXUS_ADMIN_USERNAME:-admin}
      # Set this before the first start. Once the admin account exists, it can be removed.
      MP_NEXUS_ADMIN_PASSWORD: ${MP_NEXUS_ADMIN_PASSWORD:-}
      MP_NEXUS_DATA: /data
      # Fill this only if you want the QR code to use one fixed remote address.
      # MP_NEXUS_PUBLIC_URL: https://demo.example.com
    volumes:
      - mp-nexus-data:/data

volumes:
  mp-nexus-data:
    name: mp-nexus-demo-data

